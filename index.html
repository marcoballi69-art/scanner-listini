!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scanner Gestione Listini</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:6px;background:#f3f5f7;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{max-width:620px;margin:0 auto;padding:8px;background:#fff;border-radius:12px;box-shadow:0 2px 12px #00000012}
button{width:100%;padding:12px;margin:5px 0;border:0;border-radius:10px;background:#1769aa;color:white;font-size:17px;font-weight:bold}
button.finish{background:#188038}
button:disabled{opacity:.55}
#risultato{min-height:104px;padding:12px;margin:5px 0;border:2px solid #1769aa;border-radius:10px;background:#eef6ff;font-size:23px;line-height:1.3;font-weight:bold;white-space:pre-line;overflow-wrap:anywhere;text-align:center;display:flex;align-items:center;justify-content:center}
#reader{width:100%;margin:4px 0 0}
#reader video{object-fit:cover}
#stato{margin:4px 2px;color:#555;min-height:20px;font-size:13px;text-align:center}
@media(max-width:600px){main{padding:6px}#risultato{min-height:112px;font-size:25px}button{padding:11px}}
</style>
</head>
<body>
<main>
<button id="avvia">AVVIA SCANNER</button>
<div id="risultato">In attesa del primo articolo</div>
<div id="stato" aria-live="polite">Fotocamera pronta</div>
<div id="reader"></div>
<button id="fine" class="finish">FINE — TERMINA SCANSIONE</button>
</main>
<script>
(() => {
  const stato = document.getElementById('stato');
  const risultato = document.getElementById('risultato');
  const avvia = document.getElementById('avvia');
  const fine = document.getElementById('fine');
  let scanner = null, attivo = false, ultimoCodice = '', ultimoInvio = 0;
  let audioContext = null, terminato = false;

  function beep() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioContext = audioContext || new AC();
      if (audioContext.state === 'suspended') audioContext.resume();
      const now = audioContext.currentTime;
      [1050,1450].forEach((freq,i) => {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, now + i*0.13);
        gain.gain.exponentialRampToValueAtTime(0.20, now + i*0.13 + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i*0.13 + 0.105);
        osc.connect(gain); gain.connect(audioContext.destination);
        osc.start(now + i*0.13); osc.stop(now + i*0.13 + 0.11);
      });
    } catch(e) {}
  }

  function inviaCodice(codice) {
    if (!window.opener || window.opener.closed) {
      stato.textContent = 'Collegamento alla pagina principale assente. Riapri lo scanner da Gestione Listini.';
      return;
    }
    window.opener.postMessage({type:'GESTIONE_LISTINI_BARCODE', code:codice}, '*');
    stato.textContent = 'Codice letto. Verifica articolo nel listino...';
  }

  window.addEventListener('message', event => {
    if (event.source !== window.opener) return;
    const d = event.data;
    if (!d || d.type !== 'GESTIONE_LISTINI_SCAN_RESULT') return;
    if (d.found) {
      risultato.textContent = (d.duplicate ? 'GIÀ PRESENTE\n' : 'AGGIUNTO\n') +
        (d.name || 'Articolo') + '\n' + (d.price || '');
      stato.textContent = d.duplicate
        ? 'Questo articolo era già nella lista. Inquadra il prossimo.'
        : 'Articolo aggiunto correttamente. Puoi inquadrare il prossimo.';
    } else {
      risultato.textContent = 'ARTICOLO NON TROVATO';
      stato.textContent = 'Non presente nel listino. Puoi cercarlo per nome nella pagina principale.';
    }
  });

  async function fermaScanner() {
    if (scanner && attivo) {
      try { await scanner.stop(); } catch(e) {}
      try { await scanner.clear(); } catch(e) {}
    }
    attivo = false;
    scanner = null;
  }

  avvia.addEventListener('click', async () => {
    if (attivo || terminato) return;
    if (typeof Html5Qrcode === 'undefined') {
      stato.textContent = 'Scanner non caricato. Controlla la connessione e ricarica la pagina.';
      return;
    }
    avvia.disabled = true;
    stato.textContent = 'Avvio fotocamera...';
    try {
      scanner = new Html5Qrcode('reader');
      const config = {
        fps: 20,
        qrbox: (viewfinderWidth, viewfinderHeight) => ({
          width: Math.floor(viewfinderWidth * 0.94),
          height: Math.floor(viewfinderHeight * 0.58)
        }),
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.ITF
        ],
        rememberLastUsedCamera: true
      };
      await scanner.start({facingMode:'environment'}, config, decoded => {
        const code = String(decoded || '').trim();
        const now = Date.now();
        if (!code || (code === ultimoCodice && now - ultimoInvio < 2200)) return;
        ultimoCodice = code;
        ultimoInvio = now;
        beep();
        inviaCodice(code);
      }, () => {});
      attivo = true;
      avvia.textContent = 'FOTOCAMERA ATTIVA';
      stato.textContent = 'Fotocamera attiva';
    } catch(e) {
      stato.textContent = 'Errore fotocamera: ' + (e && e.message ? e.message : String(e));
      scanner = null;
      attivo = false;
      avvia.disabled = false;
      avvia.textContent = 'RIPROVA AD AVVIARE';
    }
  });

  fine.addEventListener('click', async () => {
    terminato = true;
    fine.disabled = true;
    stato.textContent = 'Chiusura scanner...';
    await fermaScanner();
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({type:'GESTIONE_LISTINI_SCAN_FINISH'}, '*');
    }
    stato.textContent = 'Scansione terminata. Torna a Gestione Listini.';
    setTimeout(() => { try { window.close(); } catch(e) {} }, 400);
  });

  window.addEventListener('pagehide', () => { fermaScanner(); });
})();
</script>
</body>
</html>
